name: Installer checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Bash syntax
        run: |
          bash -n weaponize.sh
          for script in templates/scripts/*.sh; do bash -n "$script"; done
      - name: ShellCheck
        run: shellcheck weaponize.sh templates/scripts/*.sh
      - name: Offline regression tests
        run: python3 -m unittest discover -s tests -v
  kali-package-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Resolve profiles against current Kali rolling (amd64)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work:ro" -w /work \
            kalilinux/kali-rolling bash -c '
              set -Eeuo pipefail
              apt-get -o APT::Update::Error-Mode=any update
              source ./weaponize.sh
              RUN_DIR="$(mktemp -d)"
              run_sudo() { "$@"; }
              for PROFILE in core extra; do
                for VIRTUALIZATION_PLATFORM in none qemu vmware virtualbox; do
                  EXTRAS=""; CONFIGURE_SHELL=0
                  select_options
                  build_package_lists
                  info "Preflight: $PROFILE / $VIRTUALIZATION_PLATFORM"
                  preflight_packages
                done
              done
            '
