name: Installer checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Bash syntax
        run: bash -n weaponize.sh && bash -n templates/scripts/get-burp-certificate.sh
      - name: ShellCheck
        run: shellcheck weaponize.sh templates/scripts/get-burp-certificate.sh
      - name: Offline regression tests
        run: python3 -m unittest discover -s tests -v
